Summary: Ad-free Reddit client for Android
Description: |-
  Ad-free Reddit client for Android. Fork of Infinity for Reddit with a clean
  UI and custom API client ID support.

  Binaries are the original, developer-signed APKs from the upstream GitHub
  releases, redistributed unmodified. Only this repo's index is signed by the
  repo maintainer.

