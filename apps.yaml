continuum:
  git: https://github.com/cygnusx-1-org/continuum
  name: "Continuum"
  # Continuum's launcher icon is an adaptive (XML) icon, so fdroid can't
  # extract a raster from the APK. Point at a PNG in the upstream repo.
  icon: fastlane/metadata/android/en-US/images/icon.png
  description: |
    Ad-free Reddit client for Android. Fork of Infinity for Reddit with a clean
    UI and custom API client ID support.

    Binaries are the original, developer-signed APKs from the upstream GitHub
    releases, redistributed unmodified under the AGPL-3.0 license. Only this
    repo's index is signed by the repo maintainer.
  categories:
    - Internet
